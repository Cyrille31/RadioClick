# Temporaire : vérification des résultats de recherche (sera supprimé)
name: Sonde recherche
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for id in 541446017 1409253290; do
          curl -sSL -m 20 -A "Mozilla/5.0 (Linux; Android 14)" -H "Accept-Language: fr-FR" "https://podcasts.apple.com/fr/podcast/id$id" -o ap.html; ls -la ap.html
          python3 - <<'PY'
          import re
          s=open('ap.html',encoding='utf-8').read()
          print('scripts:', re.findall(r'<script[^>]*id="([^"]+)"[^>]*>', s)[:10])
          print('types:', set(re.findall(r'<script type="([^"]+)"', s)))
          i=s.find('.mp3')
          print('--- around mp3 ---'); print(s[max(0,i-1500):i+300])
          keys=re.findall(r'"([a-zA-Z]+)":', s)
          from collections import Counter
          print(Counter(keys).most_common(60))
          PY
          done
