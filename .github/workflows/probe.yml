# Temporaire : sonde (sera supprimée)
name: Sonde recherche
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          q() { curl -sS -G "https://de1.api.radio-browser.info/json/stations/$1" "${@:2}" -d limit=8 -d hidebroken=true -d order=clickcount -d reverse=true | python3 -c "
          import json,sys
          for r in json.load(sys.stdin): print('   ',repr(r['name']),'|',r['countrycode'],'|',r['url_resolved'][:70],'| fav:',r['favicon'][:80],'| home:',r['homepage'][:50],'| ok:',r['lastcheckok'])"; }
          for t in "radio présence" "radio presence" "présence" "presence" "Radio Présence Toulouse"; do echo "== name: $t"; q search --data-urlencode "name=$t"; done
          echo "== byurl france inter"
          curl -sS "https://de1.api.radio-browser.info/json/stations/byurl?url=https://icecast.radiofrance.fr/franceinter-hifi.aac" | python3 -c "import json,sys;[print('   ',r['name'],'| fav:',r['favicon']) for r in json.load(sys.stdin)]"
          for t in "France Inter" "franceinfo" "France Culture" "France Musique" "FIP" "Mouv"; do echo "== $t"; q search --data-urlencode "name=$t" -d countrycode=FR; done
          echo "== favicons check"
          for u in "https://www.radiofrance.fr/s3/cruiser-production/2022/05/b6d4b3b5-6f5e-4d4f-a1b0-61f4f1f9b52c/400x400_franceinter.jpg"; do curl -sS -o /dev/null -w "%{http_code} %{content_type}\n" "$u"; done
          echo "== itunes podcasts radio presence"
          curl -sS -G "https://itunes.apple.com/search" --data-urlencode "term=radio présence" -d media=podcast -d entity=podcast -d country=FR -d limit=5 | python3 -c "import json,sys;[print('   ',r['collectionName'],'|',r['artistName']) for r in json.load(sys.stdin)['results']]"
