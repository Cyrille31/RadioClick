# Temporaire : sonde (sera supprimée)
name: Sonde recherche
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for s in franceinter fip; do
          curl -sS "https://stream.radiofrance.fr/$s/${s}_hifi.m3u8?id=radiofrance" > pl.txt
          cat pl.txt | head -12
          seg=$(grep -m1 '\.ts' pl.txt)
          python3 - "$seg" "$s" <<'PY'
          import re,sys,urllib.request
          seg,s=sys.argv[1],sys.argv[2]
          m=re.match(r'(.*_)(\d+)_(\d+)(\.ts.*)',seg)
          a,seq,ep,b=m.group(1),int(m.group(2)),int(m.group(3)),m.group(4)
          for mins in [0,5,15,30,60,180]:
              k=mins*15
              u='https://stream.radiofrance.fr'+a+str(seq-k)+'_'+str(ep-4*k)+b
              try:
                  r=urllib.request.urlopen(urllib.request.Request(u,method='GET'),timeout=10); d=r.read(); print(s,mins,'min ->',r.status,len(d))
              except Exception as e: print(s,mins,'min ->',e)
          PY
          done
