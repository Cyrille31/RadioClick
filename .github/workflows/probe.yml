# Temporaire : vérification des résultats de recherche (sera supprimé)
name: Sonde recherche
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          curl -sS -G "https://itunes.apple.com/search" --data-urlencode "term=journal france inter 8h" -d media=podcast -d entity=podcast -d country=FR -d limit=3 > s.json
          python3 -c "
          import json;d=json.load(open('s.json'))
          for r in d['results']: print({k:r.get(k) for k in ['collectionId','collectionName','feedUrl','collectionViewUrl','releaseDate','trackCount']})
          "
          id=$(python3 -c "import json;print([r for r in json.load(open('s.json'))['results'] if '08h00' in r['collectionName']][0]['collectionId'])")
          echo "== LOOKUP $id"
          curl -sS "https://itunes.apple.com/lookup?id=$id&entity=podcastEpisode&limit=4&country=FR&sort=recent" > l.json
          python3 -c "
          import json;d=json.load(open('l.json'))
          for r in d['results']: print({k:r.get(k) for k in ['wrapperType','kind','trackName','releaseDate','episodeUrl','feedUrl','artworkUrl600']})
          "
          echo "== HEAD episode"
          u=$(python3 -c "import json;print([r for r in json.load(open('l.json'))['results'] if r.get('episodeUrl')][0]['episodeUrl'])")
          curl -sSIL "$u" | grep -i "^HTTP\|^content-type\|^location" | head
          echo "== date"; date -u
