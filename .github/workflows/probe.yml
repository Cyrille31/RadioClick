# Temporaire : sonde (sera supprimée)
name: Sonde recherche
on:
  push:
    branches: [ 'claude/**' ]
    paths: [ '.github/workflows/probe.yml' ]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          sudo apt-get -qq install -y ffmpeg >/dev/null 2>&1
          python3 - <<'PY' > urls.txt
          import json,re,urllib.request
          h=urllib.request.urlopen(urllib.request.Request('https://podcasts.apple.com/fr/podcast/id541446017',headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14)'}),timeout=20).read().decode()
          print(sorted(set(re.findall(r'https://proxycast\.radiofrance\.fr/[^"]+\.mp3',h)))[-1])
          PY
          u=$(head -1 urls.txt); echo "URL: $u"
          echo "== redirections (UA navigateur)"; curl -sSIL -A "Mozilla/5.0 (Linux; Android 14)" "$u" | grep -i "^HTTP\|^location\|^content-length\|^content-type"
          echo "== redirections (UA ExoPlayer-like)"; curl -sSIL -A "RadioClic/1.0 (Android; CGExcel)" "$u" | grep -i "^HTTP\|^location\|^content-length"
          f=$(basename "$u")
          for base in "https://media.radiofrance-podcast.net/podcast09/" "http://media.radiofrance-podcast.net/podcast09/"; do
            echo "== direct: $base$f"; curl -sSIL "$base$f" | grep -i "^HTTP\|^location\|^content-length"
          done
          echo "== durées"
          curl -sSL -A "Mozilla/5.0 (Linux; Android 14)" "$u" -o a.mp3; ffprobe -v error -show_entries format=duration -of csv=p=0 a.mp3
          curl -sSL "https://media.radiofrance-podcast.net/podcast09/$f" -o b.mp3; ffprobe -v error -show_entries format=duration -of csv=p=0 b.mp3
          ls -la a.mp3 b.mp3
          echo "== live"
          for s in https://icecast.radiofrance.fr/franceinter-hifi.aac https://icecast.radiofrance.fr/franceinfo-hifi.aac https://icecast.radiofrance.fr/franceculture-hifi.aac https://icecast.radiofrance.fr/fip-hifi.aac https://icecast.radiofrance.fr/francemusique-hifi.aac https://icecast.radiofrance.fr/mouv-hifi.aac; do
            echo "$s $(curl -sS -o /dev/null -m 5 -w '%{http_code} %{content_type}' $s)"
          done
          for t in "RTL" "Europe 1" "RMC" "France Bleu" "ici Occitanie" "Nostalgie" "RFI"; do
            curl -sS -G "https://de1.api.radio-browser.info/json/stations/search" --data-urlencode "name=$t" -d countrycode=FR -d limit=3 -d hidebroken=true -d order=clickcount -d reverse=true | python3 -c "import json,sys;[print('  $t ->',r['name'],'|',r['url_resolved'],'|',r['favicon'][:60]) for r in json.load(sys.stdin)]"
          done
