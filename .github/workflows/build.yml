#
# Compile l'APK à chaque envoi et la publie comme artefact téléchargeable
# (onglet « Actions » du dépôt > dernière exécution > « Artifacts »).
#
# Signature stable : définir les secrets du dépôt (Settings > Secrets and variables > Actions)
#   KEYSTORE_BASE64    keystore .jks encodé en base64
#   KEYSTORE_PASSWORD  mot de passe du keystore
#   KEY_ALIAS          alias de la clé
#   KEY_PASSWORD       mot de passe de la clé
# Sans ces secrets, l'APK est signée avec une clé de débogage temporaire
# (elle ne pourra pas s'installer par-dessus une version précédente).

name: Compilation APK

on:
  push:
    branches: [ main, master, 'claude/**' ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
            echo "RADIOCLIC_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Keystore installé : signature stable."
          else
            echo "::warning::Secret KEYSTORE_BASE64 absent : APK signée avec une clé de débogage temporaire."
          fi

      - name: Compilation
        env:
          RADIOCLIC_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RADIOCLIC_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RADIOCLIC_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testReleaseUnitTest assembleRelease

      - name: Renommage de l'APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/RadioClic-1.0.${GITHUB_RUN_NUMBER}.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: RadioClic-1.0.${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
